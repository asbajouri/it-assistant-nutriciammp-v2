<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>چت با هوش مصنوعی محلی</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: Tahoma, "Segoe UI", sans-serif;
    background: #f0f2f5; height: 100vh; display: flex; flex-direction: column;
  }
  header {
    background: linear-gradient(135deg, #1a7a3c, #0d5c2a); color: white;
    padding: 16px 20px; text-align: center;
  }
  header h1 { margin: 0; font-size: 17px; }
  header p { margin: 4px 0 0; font-size: 12px; opacity: 0.9; }
  #messages {
    flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px;
  }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; line-height: 1.7; font-size: 14px; white-space: pre-wrap; }
  /* ۱۳ اوت ۲۰۲۶: چون #messages داخل یه صفحه‌ی dir="rtl" هست، align-self روی محور عرضی طبق همون
     جهت حل میشه — یعنی flex-end در RTL یعنی «چپ»، نه «راست». قبلاً user (سوالی که خودِ کاربر
     تایپ می‌کنه) با flex-end سمت چپ می‌افتاد و assistant با flex-start سمت راست — دقیقاً برعکسِ
     رفتار درستِ پنل اصلی (App.jsx) که سوال کاربر همیشه راست و جواب دستیار همیشه چپه. حالا برعکس شد. */
  .msg.user { align-self: flex-start; background: #1a7a3c; color: white; border-bottom-right-radius: 2px; }
  .msg.assistant { align-self: flex-end; background: white; color: #222; border: 1px solid #e0e0e0; border-bottom-left-radius: 2px; }
  .msg .src { display: block; margin-top: 6px; font-size: 11px; color: #999; border-top: 1px solid #eee; padding-top: 4px; }
  .msg.error { align-self: center; background: #fdecea; color: #a83232; border: 1px solid #f5c6cb; font-size: 13px; }
  .msg.loading { align-self: flex-end; background: white; border: 1px solid #e0e0e0; color: #999; font-size: 13px; }
  #inputBar { display: flex; gap: 8px; padding: 12px; background: white; border-top: 1px solid #e0e0e0; }
  #inputBox {
    flex: 1; border: 1px solid #ccc; border-radius: 20px; padding: 10px 16px; font-size: 14px;
    font-family: inherit; outline: none;
  }
  #inputBox:focus { border-color: #1a7a3c; }
  #sendBtn {
    background: #1a7a3c; color: white; border: none; border-radius: 20px; padding: 0 20px;
    font-size: 14px; cursor: pointer; font-family: inherit;
  }
  #sendBtn:disabled { background: #ccc; cursor: not-allowed; }
</style>
</head>
<body>
  <header>
    <h1>🖥️ چت مستقیم با هوش مصنوعی محلی</h1>
    <p>این صفحه فقط با مدل نصب‌شده روی سرور محلی (VM) صحبت می‌کند — هیچ سرویس ابری دیگری استفاده نمی‌شود</p>
  </header>
  <div id="messages"></div>
  <div id="inputBar">
    <input id="inputBox" type="text" placeholder="سوالتون رو بنویسید..." />
    <button id="sendBtn">ارسال</button>
  </div>

<script>
  const API_URL = "https://asbajouri-it-assistant-api.hf.space";
  const messagesEl = document.getElementById("messages");
  const inputBox = document.getElementById("inputBox");
  const sendBtn = document.getElementById("sendBtn");
  let history = [];

  // ۱۳ اوت ۲۰۲۶: بابل پیام‌ها همیشه direction:rtl ثابت داشت، پس وقتی جواب مدل محلی عمدتاً انگلیسی
  // بود، چپ‌چین درست نشون داده نمی‌شد. عیناً همون تابع isLatinText که توی App.jsx (چت اصلی) همین
  // مشکل رو حل کرده بود، اینجا هم اضافه شد.
  function isLatinText(text) {
    const persianArabicChars = (text.match(/[\u0600-\u06FF\u0750-\u077F]/g) || []).length;
    const latinChars = (text.match(/[A-Za-z]/g) || []).length;
    if (latinChars === 0) return false;
    return persianArabicChars <= 3;
  }

  function addMessage(role, text, source) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;
    if (isLatinText(text)) {
      div.style.direction = "ltr";
      div.style.textAlign = "left";
    } else {
      div.style.direction = "rtl";
      div.style.textAlign = "right";
    }
    if (source) {
      const srcEl = document.createElement("span");
      srcEl.className = "src";
      srcEl.textContent = "منبع: " + source;
      div.appendChild(srcEl);
    }
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  // ۱۳ اوت ۲۰۲۶: این صفحه مستقیم به مدل محلی (بدون system_prompt کامل/قوانین BASE_KNOWLEDGE
  // که میگه «هرگز Markdown استفاده نکن») وصل میشه، پس مدل گاهی از **بولد**/# هدر استفاده می‌کنه.
  // چون این صفحه متن رو خام (textContent) نشون می‌ده، این نشونه‌ها رندر نمی‌شدن و عیناً روی
  // صفحه می‌موندن (**مثل این**). همون پاک‌سازی‌ای که توی پنل اصلی دستیار هست، اینجا هم اضافه شد.
  function stripMarkdown(text) {
    return text
      .replace(/\*\*\*/g, "—")
      .replace(/\*\*/g, "")
      .replace(/^#{1,6}\s*/gm, "");
  }

  async function send() {
    const text = inputBox.value.trim();
    if (!text) return;
    inputBox.value = "";
    sendBtn.disabled = true;
    addMessage("user", text);
    history.push({ role: "user", content: text });
    const loadingEl = addMessage("loading", "⏳ در حال فکر کردن... (روی سخت‌افزار محلی، ممکنه تا چند دقیقه طول بکشه)");

    try {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 130000);
      const res = await fetch(API_URL + "/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history, system_prompt: "", force_lmstudio: true }),
        signal: controller.signal,
      });
      clearTimeout(timeout);
      const data = await res.json();
      loadingEl.remove();
      if (!res.ok || !data.reply) {
        addMessage("error", "⚠️ " + (data.error || "خطای نامشخص از سرور"));
      } else {
        // ⚠️ ۱۳ اوت ۲۰۲۶: قبلاً وقتی مدل از سمت VM ارسال نمی‌شد، اینجا "نامشخص"/"؟" نشون داده
        // می‌شد. بک‌اند الان همیشه یه اسم مدل واقعی (حداقل پیش‌فرض مستندشده) برمی‌گردونه.
        const modelName = (data.source || "").split(":")[1];
        const label = modelName ? `سرور لوکال — مدل: ${modelName}` : "سرور لوکال";
        addMessage("assistant", stripMarkdown(data.reply), label);
        history.push({ role: "assistant", content: data.reply });
      }
    } catch (e) {
      loadingEl.remove();
      addMessage("error", "⚠️ اتصال قطع شد یا خیلی طول کشید: " + e.message);
    }
    sendBtn.disabled = false;
    inputBox.focus();
  }

  sendBtn.addEventListener("click", send);
  inputBox.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
  addMessage("assistant", "سلام! من مستقیم به هوش مصنوعی محلی وصلم. هر سوالی داری بپرس.");
</script>
</body>
</html>
